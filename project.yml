name: PaperReader
options:
  bundleIdPrefix: dev.paperreader
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
settings:
  base:
    PRODUCT_NAME: PageWise
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: App/Info.plist
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 0.5.0
packages:
  PaperReader:
    path: .
targets:
  PaperReader:
    type: application
    productName: PageWise
    platform: macOS
    sources: [App]
    dependencies:
      - package: PaperReader
        product: PaperReaderUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.paperreader.mac
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: App/PaperReader.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
  PaperReader-iPad:
    type: application
    productName: PageWise
    platform: iOS
    sources: [App]
    dependencies:
      - package: PaperReader
        product: PaperReaderUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.paperreader.ipad
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
